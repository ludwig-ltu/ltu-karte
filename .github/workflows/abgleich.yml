name: Abgleich mit dem Backend

on:
  schedule:
    - cron: "17 2 * * *"   # täglich ca. 3:17 Uhr deutscher Zeit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: abgleich
  cancel-in-progress: false

jobs:
  abgleich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shapely==2.0.6
      - name: Schulen aus dem Backend lesen
        env:
          LTU_API_URL: ${{ secrets.LTU_API_URL }}
          LTU_API_TOKEN: ${{ secrets.LTU_API_TOKEN }}
        run: python scripts/sync_backend.py
      - name: Kartendaten bauen
        run: python scripts/build_data.py
      - name: Änderungen speichern
        run: |
          git config user.name "ltu-karte-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Kartendaten aktualisiert"
          git push
